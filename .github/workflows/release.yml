name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: dist:mac
          - platform: windows
            os: windows-latest
            script: dist:win
          - platform: linux
            os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "JK BMS Monitor $GITHUB_REF_NAME" \
            --notes "Перший реліз JK BMS Monitor.

          - Моніторинг JK BMS через Bluetooth LE.
          - Окремі історії вимірювань і періодів заряду/розряду для кожного пристрою.
          - Графіки напруги комірок, опір комірок, тривоги та прогноз розряду.
          - Перетягуване адаптивне компонування панелей.
          - Інсталятори для Windows, macOS і Linux."
